# Custom color codes: looping and clipping
#
# A named color code (DIN, IEC, BW, TEL, TELALT, T568A, T568B) assigns a
# fixed palette to a cable. When the wirecount does not match the palette:
#
#   clipping - fewer wires than palette colors: only the first N colors are used
#   looping  - more wires than palette colors: the palette is repeated as needed

connectors:
  X1:
    pincount: 3
    type: Molex KK 254
    subtype: female
  X2:
    pincount: 3
    type: Molex KK 254
    subtype: male
  X3:
    pincount: 5
    type: Molex KK 254
    subtype: female
  X4:
    pincount: 5
    type: Molex KK 254
    subtype: male
  X5:
    pincount: 4
    type: Molex KK 254
    subtype: female
  X6:
    pincount: 4
    type: Molex KK 254
    subtype: male

cables:
  W1: # clipping: IEC has 10 colors, only the first 3 are used (BN, RD, OG)
    wirecount: 3
    length: 0.3
    gauge: 0.25 mm2
    color_code: IEC
  W2: # looping: BW has 2 colors, repeated 3 times and clipped (BK, WH, BK, WH, BK)
    wirecount: 5
    length: 0.3
    gauge: 0.25 mm2
    color_code: BW
  W3: # neither: DIN has 60 colors, exactly the first 4 are used
    wirecount: 4
    length: 0.3
    gauge: 0.25 mm2
    color_code: DIN

connections:
  -
    - X1: [1-3]
    - W1: [1-3]
    - X2: [1-3]
  -
    - X3: [1-5]
    - W2: [1-5]
    - X4: [1-5]
  -
    - X5: [1-4]
    - W3: [1-4]
    - X6: [1-4]
