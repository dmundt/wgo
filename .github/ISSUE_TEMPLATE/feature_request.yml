name: Feature request
description: Suggest an enhancement
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve? Note that wgo is a direct WireViz port — features beyond WireViz 0.4.1 are out of scope unless justified.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the change and how it affects output parity.
    validations:
      required: true
